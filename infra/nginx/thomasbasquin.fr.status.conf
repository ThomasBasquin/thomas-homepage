# Snippet à insérer dans /etc/nginx/sites-enabled/thomasbasquin.fr,
# avant le `location /` générique. Gardé ici pour ne pas perdre la config
# (nginx ne charge pas ce fichier automatiquement).
#
# Credentials : sudo htpasswd -c /etc/nginx/.htpasswd_status thomas

location = /status.json {
    alias /var/www/status-data/status.json;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd_status;
    add_header Cache-Control "no-store";
}

location ~ ^/status(/|$) {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd_status;
    try_files $uri $uri/ =404;
}
